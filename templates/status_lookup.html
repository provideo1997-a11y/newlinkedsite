{% extends "base.html" %}{% block content %}<section class="formbox narrow"><h1>{{ t('status') }}</h1><p class="muted">Enter your case reference and submission email.</p><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t('reference') }}<input name="reference" maxlength="24" required></label><label>{{ t('email') }}<input type="email" name="email" maxlength="254" required></label><button class="btn">{{ t('lookup') }}</button></form>{% if searched %}{% if result %}<aside class="notice">{{ t('status') }}: <b>{{ t(result.status) }}</b> · {{ result.reference }}</aside>{% else %}<p class="flash error">{{ t('not_found') }}</p>{% endif %}{% endif %}</section>{% endblock %}
