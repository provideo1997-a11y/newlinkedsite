{% extends "base.html" %}{% block content %}<section class="formbox"><small class="eyebrow">PRIVATE CASE INTAKE</small><h1>{{ t('case') }}</h1><p class="muted">Fields marked optional may be left blank. Use the language switcher above.</p><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid"><label>{{ t('name') }} *<input name="name" maxlength="100" required></label><label>{{ t('email') }} *<input name="email" type="email" maxlength="254" required></label><label>{{ t('platform') }} *<select name="platform"><option>Not specified</option>{% for p in ['Instagram','Facebook','TikTok','Google','X','LinkedIn','Other'] %}<option>{{ p }}</option>{% endfor %}</select></label><label>{{ t('handle') }}<input name="handle" maxlength="200"></label><label>{{ t('phone') }}<input name="phone" maxlength="32"></label><label>{{ t('date') }}<input name="incident_date" type="date"></label><label>{{ t('category') }} *<select name="category">{% for c in ['recovery','risk','impersonation','scam','privacy','reputation','compliance','security','other'] %}<option value="{{ c }}">{{ c|title }}</option>{% endfor %}</select></label><label>{{ t('priority') }}<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="critical">Critical</option></select></label><label class="full">{{ t('evidence') }}<input name="evidence_url" type="url" maxlength="500" placeholder="https://..."></label><label class="full">{{ t('description') }} *<textarea name="description" rows="6" minlength="25" maxlength="5000" required></textarea><small>{{ t('hint') }}</small></label></div><section class="choice"><h3>{{ t('next') }}</h3><label><input type="radio" name="preferred_next_step" value="inbox" checked> <b>{{ t('inbox') }}</b><small>{{ t('inbox_desc') }}</small></label><label><input type="radio" name="preferred_next_step" value="whatsapp"> <b>{{ t('whatsapp') }}</b><small>{{ t('whatsapp_desc') }}</small></label></section><label class="human">{{ t('human',a=a,b=b) }}<input name="human_answer" inputmode="numeric" maxlength="3" required></label><label class="consent"><input type="checkbox" name="consent" value="yes" required><span>{{ t('consent') }}</span></label><aside class="notice">{{ t('privacy') }}</aside><div class="trap"><label>Leave blank<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="btn">{{ t('submit') }}</button><p class="tiny">* Required</p></form></section>{% endblock %}
