{% extends 'base.html' %}{% block title %}{{ t('login') }} — YAKUZA{% endblock %}{% block content %}<section class="admin-login"><span class="section-kicker">{{ t('login_kicker') }}</span><h1>{{ t('login') }}</h1><p class="admin-subtitle">{{ t('login_subtitle') }}</p><form method="post">{{ form.hidden_tag() }}<label>{{ t('username') }}{{ form.username(class_='field',autocomplete='username') }}</label><label>{{ t('password') }}{{ form.password(class_='field',autocomplete='current-password') }}</label><button class="button button-primary" type="submit">{{ t('sign_in') }} ↗</button></form></section>{% endblock %}
