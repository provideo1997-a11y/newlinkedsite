services:
  - type: web
    name: yakuza-private-case-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_URL_PREFIX
        value: /private-inbox
      - key: WHATSAPP_NUMBER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: INTAKE_RATE_LIMIT
        value: 30 per hour
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: PYTHON_VERSION
        value: 3.12.8
