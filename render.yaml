services:
  - type: web
    name: yakuza-digital-agency
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_URL_PREFIX
        value: /private-inbox
      - key: WHATSAPP_NUMBER
        value: "4917642484892"
